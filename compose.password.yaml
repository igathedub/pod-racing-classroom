# Optional whole-site password gate. Use together with compose.yaml.
services:
  classroom:
    ports: !reset []

  password-gate:
    image: caddy:2.11.6-alpine@sha256:d44355d3c2149dc580ce2cac735955d1c08d3d00882c30489c241aa51a5c10d9
    # Official binary carries cap_net_bind_service; copy to ephemeral RAM so
    # cap_drop ALL can execute it without any capability or writable image layer.
    entrypoint: ["/bin/sh", "-ec"]
    command: ["cp /usr/bin/caddy /run/caddy; exec /run/caddy run --config /etc/caddy/Caddyfile --adapter caddyfile"]
    tmpfs:
      - /run:rw,exec,nosuid,size=64m,mode=0755
    environment:
      POD_SITE_USER: "${POD_SITE_USER:-igor}"
      POD_SITE_PASSWORD_HASH: "${POD_SITE_PASSWORD_HASH:?Set a private Argon2id password hash before starting the gate}"
      GOMAXPROCS: "1"
    depends_on:
      classroom:
        condition: service_healthy
    ports:
      - "127.0.0.1:8766:8080"
    volumes:
      - type: bind
        source: ./deploy/Caddyfile.password
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: "0.50"
    mem_limit: 192m
    restart: unless-stopped
