services:
  sandbox:
    image: "${POD_BOT_IMAGE:-pod-classroom-bot:local}"
    pull_policy: build
    build:
      context: ./sandbox
    # Trusted build-completion marker, NOT the untrusted bot bootstrap.
    entrypoint: ["python", "-I", "-c", "print('Sandbox image built.')"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"

  classroom:
    build:
      context: .
    depends_on:
      sandbox:
        condition: service_completed_successfully
    ports:
      - "${POD_BIND:-127.0.0.1}:${POD_PORT:-8765}:8765"
    environment:
      POD_DATA_DIR: /data
      POD_BASE_PATH: "${POD_BASE_PATH:-}"
      POD_BOT_IMAGE: "${POD_BOT_IMAGE:-pod-classroom-bot:local}"
      POD_PUBLIC_ORIGINS: "${POD_PUBLIC_ORIGINS:-}"
      POD_ALLOWED_HOSTS: "${POD_ALLOWED_HOSTS:-}"
      POD_SUBMISSIONS_PER_MINUTE: "${POD_SUBMISSIONS_PER_MINUTE:-240}"
      POD_PRACTICE_PER_MINUTE: "${POD_PRACTICE_PER_MINUTE:-60}"
      POD_CLASS_ACCESS_REQUIRED: "${POD_CLASS_ACCESS_REQUIRED:-0}"
      POD_CLASS_COOKIE_SECURE: "${POD_CLASS_COOKIE_SECURE:-1}"
      POD_PARTICIPANT_SUBMISSIONS_PER_MINUTE: "${POD_PARTICIPANT_SUBMISSIONS_PER_MINUTE:-30}"
      POD_PARTICIPANT_PRACTICE_PER_MINUTE: "${POD_PARTICIPANT_PRACTICE_PER_MINUTE:-6}"
      POD_JOIN_PER_MINUTE: "${POD_JOIN_PER_MINUTE:-120}"
      # Do not inherit a Windows host's npipe:// DOCKER_HOST into Linux.
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - classroom-data:/data
      - type: bind
        source: ${POD_DOCKER_SOCKET:-/var/run/docker.sock}
        target: /var/run/docker.sock
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "python", "scripts/container_entrypoint.py", "--healthcheck"]
      interval: 10s
      timeout: 15s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  classroom-data:
