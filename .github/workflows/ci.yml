name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    name: Unit and Chromium (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install uv
      - run: uv sync --frozen
      - run: uv run playwright install --with-deps chromium
      # Windows/macOS hosted runners have no Docker daemon. Docker configuration
      # parsing and all Docker execution are covered by the Linux job below.
      - run: uv run python -m pytest tests/ -m "not docker" --ignore=tests/test_public_distribution_security.py
      - run: uv run python -m pytest tests/test_public_distribution_security.py -k "not digest_release_compose_config"
      - run: uv run ruff check scripts/package.py scripts/check_distribution.py tests/test_public_distribution*.py
      - run: uv run python scripts/check_distribution.py
  docker:
    name: Native Linux Docker (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install uv
      - run: uv sync --frozen
      - name: Build app and bot on native architecture
        run: |
          docker build -t pod-ci-app:${GITHUB_SHA} .
          docker build -t pod-ci-bot:${GITHUB_SHA} sandbox
          docker run --rm --network none --entrypoint python pod-ci-app:${GITHUB_SHA} -c 'import arena.app; print("App imports successfully")'
          docker run --rm --network none --entrypoint python pod-ci-bot:${GITHUB_SHA} -I -c 'print("Native bot image works")'
      - name: Public distribution and real bot isolation tests
        env:
          POD_BOT_IMAGE: pod-ci-bot:${{ github.sha }}
          POD_CHECKPOINT_BOT_IMAGE: pod-ci-bot:${{ github.sha }}
          POD_CHECKPOINT_DOCKER_TEST: '1'
          POD_CHECKPOINT_CONTEXT: default
          POD_CHECKPOINT_ENDPOINT: unix:///var/run/docker.sock
        run: |
          uv run python -m pytest tests/test_public_distribution.py tests/test_public_distribution_security.py
          uv run python -m pytest tests/ -m docker
