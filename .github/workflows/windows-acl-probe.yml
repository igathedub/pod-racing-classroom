name: Isolated Windows ACL diagnostics
on:
  pull_request:
    paths:
      - '.github/workflows/windows-acl-probe.yml'
      - 'scripts/ci_windows_acl_probe.py'
      - 'tests/test_ci_windows_acl_probe.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-probe:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install uv
      - run: uv sync --frozen
      - name: Test diagnostic redaction and fresh fixtures
        run: uv run --frozen python -m pytest tests/test_ci_windows_acl_probe.py -q
      - name: Probe owner updates on fresh disposable fixtures only
        env:
          PYTHONUTF8: '1'
        run: uv run --frozen python scripts/ci_windows_acl_probe.py
      - name: Compare native Windows PowerShell module discovery
        env:
          PYTHONUTF8: '1'
        run: |
          Remove-Item Env:PSModulePath -ErrorAction SilentlyContinue
          uv run --frozen python scripts/ci_windows_acl_probe.py
